<form method="post" class="form-panel"
      action="{{ url_for('usuario_cambiar_clave', uid=u.id) }}">
  <input type="hidden" name="modal" value="1">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="card">
    <div class="card-head">
      <h3><i class="bi bi-key"></i> Cambiar contraseña</h3>
    </div>
    {% if error %}
      <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <p class="field-hint">
      Va a establecer una nueva contraseña para
      <b>{{ 'Cuenta Principal' if u.rol == 'Super Usuario' else u.usuario }}</b>.
      La contraseña anterior dejará de servir.
    </p>
    <div class="form-grid">
      <div class="field full">
        <label for="f-ck-clave">Nueva contraseña</label>
        <input type="password" name="clave" id="f-ck-clave" required minlength="6"
               autocomplete="new-password" autofocus>
        <div class="field-hint">Mínimo 6 caracteres.</div>
      </div>
      <div class="field full">
        <label for="f-ck-clave2">Confirmar contraseña</label>
        <input type="password" name="clave2" id="f-ck-clave2" required minlength="6"
               autocomplete="new-password">
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-check2-circle"></i> Cambiar contraseña</button>
    <button type="button" class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
  </div>
</form>
