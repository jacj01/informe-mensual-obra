  <!-- ===================== FIRMAS ===================== -->
  <div class="firmas">
    <div class="firma">
      <div class="linea"></div>
      <div class="nombres">{{ p.residente or '' }}</div>
      <div class="cargo">Residente de Obra</div>
      <div class="reg">{% if p.cip_residente %}CIP: {{ p.cip_residente }}{% endif %}</div>
    </div>
    <div class="firma">
      <div class="linea"></div>
      <div class="nombres">{{ p.supervisor or '' }}</div>
      <div class="cargo">Supervisor de Obra</div>
      <div class="reg">{% if p.cip_supervisor %}CIP: {{ p.cip_supervisor }}{% endif %}</div>
    </div>
    <div class="firma">
      <div class="linea"></div>
      <div class="nombres">{{ p.administrador_obra or p.asistente or '' }}</div>
      <div class="cargo">V°B° Administración / Entidad</div>
      <div class="reg"></div>
    </div>
  </div>
