name: Build & Release

# CI/CD: en cada push a master verifica sintaxis, empaqueta la app y crea
# una GitHub Release con el zip para que los clientes se actualicen.
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REPO: jacj01/informe-mensual-obra

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile informe_web/app.py informe_web/databases.py informe_web/helpers.py informe_web/models.py informe_web/version.py
          python -c "import sys; sys.path.insert(0,'informe_web'); import version; print('VERSION', version.__version__)"

      - name: Clean sensitive/runtime data
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue informe_web/instance
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "informe_web/Respaldo BD"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue informe_web/__pycache__
          Remove-Item -Force -ErrorAction SilentlyContinue informe_web/servidor.log informe_web/servidor.pid
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue informe_web/static/uploads

      - name: Build package
        shell: pwsh
        run: |
          $sha = (git log --pretty=format:%h -1).Trim()
          $ver = (python -c "import sys; sys.path.insert(0,'informe_web'); import version; print(version.__version__)").Trim()
          $zip = "$env:GITHUB_WORKSPACE\informe-web-$ver-$sha.zip"
          Compress-Archive -Path informe_web, *.bat, *.vbs, Logo.png, .gitignore -DestinationPath $zip -Force
          echo "ARTIFACT=$zip" >> $env:GITHUB_ENV
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "SHA=$sha" >> $env:GITHUB_ENV

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ env.SHA }}
          name: v${{ env.VERSION }} (${{ env.SHA }})
          body: |
             Versión ${{ env.VERSION }} (${{ env.SHA }})
            - Empaquetado automáticamente desde GitHub Actions.
          files: ${{ env.ARTIFACT }}
