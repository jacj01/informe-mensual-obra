name: Build & Release

# CI/CD: verifica sintaxis, empaqueta la app y crea una GitHub Release con el
# zip para que los clientes se actualicen (auto-update).
# Excluye datos sensibles (BD, respaldos, logs, uploads y archivos .xlsx)
# que estan en .gitignore y no viajan por git.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile informe_web/app.py informe_web/databases.py informe_web/helpers.py informe_web/models.py informe_web/version.py
          python -c "import sys; sys.path.insert(0,'informe_web'); import version; print('VERSION', version.__version__)"

      - name: Clean sensitive/runtime data
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue -Path @("informe_web/instance", "informe_web/Respaldo BD", "informe_web/__pycache__", "informe_web/static/uploads")
          Remove-Item -Force -ErrorAction SilentlyContinue -Path @("informe_web/servidor.log", "informe_web/servidor.pid")

      - name: Build package
        shell: pwsh
        run: |
          $sha = (git log --pretty=format:"%h" -1).Trim()
          $ver = (python -c "import sys; sys.path.insert(0,'informe_web'); import version; print(version.__version__)").Trim()
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "SHA=$sha" >> $env:GITHUB_ENV
          $zip = "$env:GITHUB_WORKSPACE\informe-web-$ver-$sha.zip"
          Compress-Archive -Path informe_web, *.bat, *.vbs, Logo.png, .gitignore -DestinationPath $zip -Force
          echo "ARTIFACT=$zip" >> $env:GITHUB_ENV
          Write-Host "ARTIFACT:$zip VERSION:$ver SHA:$sha"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          SHA: ${{ env.SHA }}
          ARTIFACT: ${{ env.ARTIFACT }}
        run: |
          $tag = "v$env:VERSION-$env:SHA"
          echo "Creando release $tag con asset $env:ARTIFACT"
          gh release create "$tag" "$env:ARTIFACT" --title "v$env:VERSION ($env:SHA)" --notes "Versión $env:VERSION (commit $env:SHA). Build automático desde GitHub Actions."
